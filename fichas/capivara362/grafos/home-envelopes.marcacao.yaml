# Marcação da referência home Chuva de Envelopes (9pmbet). Logo deles apagada; personagem trocado pela capivara.
#
#   python ferramentas/desconstruir.py fichas/capivara362/grafos/home-envelopes.marcacao.yaml --placas --motor gateway --teto 0.02

peca: home-envelopes
referencia: referencias/9pmbet/home/home-envelopes.webp
ficha: fichas/capivara362/ficha-v1.0.yaml
formato: home
tema: envelopes
estado: proposta

texto_sem_contorno: true      # letras chapadas, sem contorno escuro
zona_texto: [0.070, 0.270, 0.280, 0.560]
zona_logo: [0.0, 0.0, 0.25, 0.27]
logo_caixa: [0.040, 0.110, 0.140]
# A linha curta "ÀS" some na projeção: uma caixa por linha.
texto_linhas: [[0.075, 0.290, 0.230, 0.120], [0.075, 0.415, 0.265, 0.125], [0.170, 0.540, 0.060, 0.090], [0.070, 0.635, 0.270, 0.095], [0.070, 0.740, 0.205, 0.095]]

nos:
  cena:
    tipo: fundo
    z: 0
    camada_psd: cena
    descricao: luz dourada e vermelha forte atrás do mascote, rastros de fogo; esquerda escura
  mascote:
    tipo: personagem
    z: 3
    camada_psd: mascote
    figurino: sorte
    descricao: personagem 3D de jogo (tigre) em roupa chinesa vermelha, boca aberta animado
    pose: pata esticada para a câmera à esquerda, o outro braço erguido para a direita com um envelope
    contorno: [[0.390, 0.550], [0.400, 0.350], [0.450, 0.250], [0.520, 0.250], [0.570, 0.220], [0.600, 0.100],
               [0.660, 0.020], [0.750, 0.020], [0.800, 0.100], [0.820, 0.200], [0.860, 0.180], [0.920, 0.120],
               [0.960, 0.120], [0.970, 0.220], [0.900, 0.300], [0.840, 0.350], [0.820, 0.500], [0.790, 0.650],
               [0.780, 0.800], [0.800, 1.000], [0.600, 1.000], [0.570, 0.850], [0.520, 0.780], [0.470, 0.750],
               [0.420, 0.700]]
  envelope:
    tipo: objeto_segurado
    z: 4
    camada_psd: mascote
    tema: envelopes
    descricao: envelope vermelho na mão erguida
    caixa: [0.870, 0.030, 0.120, 0.200]
  envelopes_chao:
    tipo: objeto_grupo
    z: 5
    camada_psd: frente
    tema: envelopes
    descricao: envelopes vermelhos e moedas furadas no chão, na frente do mascote
    elipses: [[0.370, 0.780, 0.140, 0.220], [0.500, 0.850, 0.120, 0.150], [0.840, 0.720, 0.160, 0.280]]

arestas:
  - {de: mascote, rel: segura, para: envelope}
  - {de: envelopes_chao, rel: cerca, para: mascote}
  - {de: texto_l2, rel: tema_liga, para: envelope, tema: envelopes}
  - {de: texto_l2, rel: tema_liga, para: envelopes_chao, tema: envelopes}

observacoes:
  - o mascote do concorrente é um tigre; na nossa geração vira a capivara com o figurino "sorte"
