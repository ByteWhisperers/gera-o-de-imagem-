# Relações que o agente lê na peça. As medidas (contraste, alinhamento,
# empilhamento do texto, quem fica sobre quem) a ferramenta calcula sozinha.
arestas:
  - {de: mascote, rel: segura, para: celular}
  - {de: mascote, rel: veste, para: medalhao}
  - {de: mascote, rel: apresenta, para: icone_canal, nota: a asa aberta aponta para o ícone}
  - {de: moedas, rel: cerca, para: mascote}
  - {de: texto_l2, rel: tema_liga, para: icone_canal, tema: telegram}
  - {de: texto_l2, rel: tema_liga, para: celular, tema: telegram}
  - {de: texto_l2, rel: tema_liga, para: medalhao, tema: telegram}
