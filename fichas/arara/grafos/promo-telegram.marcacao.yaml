# Marcação da referência promo Telegram: o que o agente propõe para a desconstrução.
#
# É a parte "semi-manual": o agente olha a peça e marca contornos aproximados
# (polígonos e elipses, em frações da largura e da altura). A ferramenta
# encaixa cada contorno na borda real da imagem, mede o texto, o logo e o
# fundo sozinha e escreve o grafo. O dono aprova o recorte uma vez por peça.
#
#   python ferramentas/desconstruir.py fichas/arara/grafos/promo-telegram.marcacao.yaml
#   python ferramentas/desconstruir.py fichas/arara/grafos/promo-telegram.marcacao.yaml --placas   # + fundo limpo no ComfyUI

peca: promo-telegram
referencia: referencias/arara/promo/promo-1790981127-d91c22ef.webp
ficha: fichas/arara/ficha-v1.1.yaml
formato: promo
tema: telegram

# Onde procurar o que a ferramenta mede sozinha.
zona_texto: [0.015, 0.22, 0.53, 0.54]
zona_logo: [0.0, 0.0, 0.32, 0.26]

