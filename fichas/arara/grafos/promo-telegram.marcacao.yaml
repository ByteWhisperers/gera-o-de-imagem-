    tipo: objeto_segurado
    z: 4
    camada_psd: mascote
    tema: telegram
    descricao: celular com o ícone azul do Telegram na tela
    caixa: [0.858, 0.410, 0.114, 0.309]
  medalhao:
    tipo: acessorio
    z: 4
    camada_psd: mascote
    tema: telegram
    descricao: medalhão de ouro com o avião de papel, na corrente
    caixa: [0.776, 0.647, 0.048, 0.113]
