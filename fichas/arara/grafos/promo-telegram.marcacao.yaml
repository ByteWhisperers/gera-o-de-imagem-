    pose: asa esquerda aberta apresentando o ícone, a outra mão segura o celular
    contorno: [[0.421, 0.196], [0.452, 0.235], [0.478, 0.268], [0.492, 0.300], [0.505, 0.345], [0.525, 0.380],
               [0.548, 0.425], [0.594, 0.475], [0.631, 0.511],
               [0.680, 0.475], [0.701, 0.392], [0.701, 0.297], [0.685, 0.178], [0.690, 0.095], [0.744, 0.059],
               [0.808, 0.071], [0.840, 0.131], [0.894, 0.178], [0.921, 0.261], [0.905, 0.392], [0.972, 0.457],
               [0.964, 0.594], [0.961, 0.665], [1.000, 0.689], [1.000, 0.879], [0.969, 0.891], [0.889, 0.903],
               [0.862, 0.986], [0.851, 1.000], [0.658, 1.000], [0.631, 0.903], [0.648, 0.808], [0.641, 0.782],
               [0.612, 0.792], [0.574, 0.750], [0.526, 0.702], [0.478, 0.614], [0.452, 0.545], [0.436, 0.475], [0.424, 0.392], [0.419, 0.300], [0.421, 0.215]]
