  - {de: coracao_frente, rel: cerca, para: mascote, nota: no primeiro plano, na frente da barriga}
  - {de: texto_l2, rel: tema_liga, para: celular, tema: instagram}
  - {de: texto_l2, rel: tema_liga, para: icone_grande, tema: instagram}
