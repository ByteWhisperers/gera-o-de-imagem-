# O que a peça mostra e a ficha v1.1 não prevê (vai para a proposta da v1.2).
observacoes:
  - "o trono de ouro com estofado verde fica atrás do mascote e foi para a camada mascote (z 2); a ficha diz sentado num trono, mas não diz que o trono é uma parte própria, com contorno"
  - "camada frente: mesinha de vidro com óculos escuros, taça de drinque tropical e uma folha grande no primeiro plano cobrem a base do trono e do mascote; a ficha v1.1 não tem camada frente"
  - "entorno: uma esfera de vidro com coroa de ouro sobre um pedestal, à esquerda; a ficha fala em drinque e ornamentos de ouro, sem a esfera"
  - "cena: mais escura e fechada que nas outras peças, com céu verde-escuro em cima; o sol aparece pequeno, à esquerda do mascote"
  - "texto: três linhas; a última é uma palavra dourada enorme (1,7 vez a altura da primeira linha branca)"
