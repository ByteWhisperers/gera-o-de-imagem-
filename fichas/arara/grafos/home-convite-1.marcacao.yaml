# Marcação da referência home banner1 (tema convite): o que o agente propõe para a desconstrução.
#
# Segue o modelo aprovado (promo-telegram.marcacao.yaml). Contornos a olho, em
# frações da largura e da altura; a ferramenta encaixa cada um na borda real.
#
#   python ferramentas/desconstruir.py fichas/arara/grafos/home-convite-1.marcacao.yaml

