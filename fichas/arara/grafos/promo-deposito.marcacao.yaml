# Relações que o agente lê na peça.
arestas:
  - {de: mascote, rel: segura, para: moeda_erguida, nota: a asa erguida mostra a moeda}
  - {de: mascote, rel: veste, para: coroa}
  - {de: mascote, rel: veste, para: colar}
  - {de: mascote, rel: veste, para: pulseira_alta}
  - {de: mascote, rel: veste, para: pulseira_baixa}
  - {de: moedas, rel: cerca, para: mascote}
  - {de: bau, rel: cerca, para: mascote, nota: atrás da asa direita}
  - {de: moedas_frente, rel: cerca, para: mascote, nota: na frente da asa direita, da cauda e do galho}
  - {de: monte_moedas, rel: cerca, para: mascote, nota: na frente das pontas da asa direita}
  - {de: texto_l1, rel: tema_liga, para: moeda_erguida, tema: deposito}
  - {de: texto_l1, rel: tema_liga, para: moedas, tema: deposito}
  - {de: texto_l1, rel: tema_liga, para: moedas_frente, tema: deposito}
  - {de: texto_l1, rel: tema_liga, para: bau, tema: deposito}
  - {de: texto_l1, rel: tema_liga, para: monte_moedas, tema: deposito}

observacoes:
  - "camada frente: o galho com o tufo de musgo esconde a parte de baixo do corpo e corta a cauda (a cauda aparece embaixo dele); quatro moedas soltas e um montinho de moedas ficam na frente do mascote ou do galho (cobrindo a ponta da asa direita e a cauda); a ficha v1.1 não tem camada frente"
  - "cena: verde dominante (céu, torres e rio esverdeados), não o pôr do sol dourado e verde-azulado que a ficha descreve; riscos de luz verde neon no fundo; um galho grosso onde o mascote se apoia, que a ficha não prevê"
  - "entorno: além das moedas soltas que o tema deposito pede, há um baú aberto cheio de moedas no canto direito; as moedas são do tipo com furo quadrado no meio"
  - "o mascote segura a moeda erguida pela mão da asa (mão de dedos escuros com pulseira), não com a ponta da asa como o tema descreve"
