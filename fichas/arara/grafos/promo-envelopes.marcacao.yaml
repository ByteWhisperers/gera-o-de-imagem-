# O que a peça mostra e a ficha v1.1 não prevê (vai para a proposta da v1.2).
observacoes:
  - "figurino turista sem óculos escuros: a ficha descreve o turista sempre com óculos; aqui o mascote tem os olhos à mostra e uma camisa havaiana aberta, sem corrente de ouro visível"
  - "entorno: 16 envelopes nítidos atrás do mascote, mais dezenas de envelopes pequenos e desfocados que ficaram na cena; a ficha só diz envelopes caindo como chuva, sem dizer quantos nem que a profundidade varia (nítidos perto, desfocados longe e no primeiro plano)"
  - "camada frente: seis envelopes grandes e desfocados no primeiro plano, alguns cobrindo a asa e o galho; a ficha v1.1 não tem camada frente"
  - "cena: um galho grosso embaixo do mascote, como nas peças de convite e depósito; a ficha não prevê galho nem apoio"
  - "texto: a última linha mistura uma parte dourada grande com palavras brancas menores; a ficha só prevê um estilo por linha"
