# Como o portão usa o gateway de imagem (repositório 22kofking/gateway-imagem).
# Isto é do modelo, não do estilo: trocar de modelo mexe aqui, a ficha continua a mesma.
#
# A chave do app NÃO fica aqui: vai na variável de ambiente GATEWAY_CHAVE.
# GATEWAY_URL, se definida, troca a `url` abaixo.
url: http://127.0.0.1:8000
# Nome do catálogo do gateway (GET /v1/models). "rapido" = Z-Image Turbo, Apache 2.0, uso comercial ok.
modelo: rapido
# Preço de cada imagem nova, usado para conferir o teto ANTES de pedir.
# O custo registrado é o que o gateway informa (cost_usd); este só entra quando ele não informa.
preco_por_imagem_usd: 0.005
# Quanto esperar cada imagem, em segundos.
espera_max: 300
# Proporção de cada parte (a mesma do ComfyUI). O gateway gera no tamanho aceito
# de proporção mais parecida e o portão corta o centro nesta proporção.
tamanhos:
  cena:
    home: [1024, 320]
    promo: [1024, 448]
  mascote: [512, 704]
  entorno: [768, 512]
  frente: [768, 512]
# Como tirar o fundo de cada parte transparente (ver motor/recorte.py).
# Começa igual ao ComfyUI; ajustar depois de ver as primeiras partes do modelo novo.
recorte:
  mascote: modelo
  entorno: cor_da_borda
  frente: liso
