# Como o portão usa o ComfyUI. Isto é do modelo, não do estilo: trocar de
# modelo mexe aqui, a ficha continua a mesma.
#
# SD-Turbo: gratuito e roda em CPU, bom para validar o fluxo. A licença dele
# é de pesquisa, não comercial: para produção, troque o checkpoint.
url: http://127.0.0.1:8188
checkpoint: sd_turbo.safetensors
passos: 4
cfg: 1.0
negativo: text, letters, words, watermark, logo, blurry, deformed
# Tamanho de geração por parte (múltiplos de 64). A composição redimensiona.
tamanhos:
  cena:
    home: [1024, 320]
    promo: [1024, 448]
  mascote: [512, 704]
  entorno: [768, 512]
# Como tirar o fundo de cada parte transparente (ver motor/recorte.py).
# O SD-Turbo não obedece ao "fundo cinza liso": o mascote vem com fundo
# texturizado (precisa do modelo de recorte) e o entorno com degradê.
recorte:
  mascote: modelo
  entorno: cor_da_borda
# Compilador grafo -> workflow (motor/compilador.py). São os botões que o loop
# de produção ajusta, um por vez, anotando o resultado de cada tentativa.
compilador:
  # Quanto cada tipo de parte pode mudar em relação à referência (0 = igual, 1 = do zero).
  denoise: {fundo: 0.35, personagem: 0.5, objeto: 0.5}
  denoise_placa: 0.8          # inpainting das placas (apagar texto, logo, mascote e entorno)
  lado: {fundo: 1024, personagem: 640, objeto: 640}   # lado maior da geração, em px
  margem: 0.04                # folga em volta da caixa de cada parte, em fração do lado
  sampler: euler_ancestral
  scheduler: normal
  # Trechos do prompt da ficha que não servem quando a parte é refeita no lugar dela.
  tirar_do_prompt:
    - ", isolated on a plain light grey studio background"
    - ", centered"
